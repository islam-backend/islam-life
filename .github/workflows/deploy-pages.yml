name: Deploy to GitHub Pages

# Requires: repo Settings → Pages → "Build and deployment" → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flips Settings → Pages → Source to "GitHub Actions" automatically
      # (otherwise GitHub's branch-based "pages build and deployment" keeps
      # serving the repo-root index.html and this build never wins).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_TARGET: pages

      # GitHub Pages has no SPA rewrite — serve the app shell for any
      # unknown path so client-side routes (e.g. /islam-life/calendar) work.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
