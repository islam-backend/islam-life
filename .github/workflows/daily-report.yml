name: Daily Report

on:
  schedule:
    # 20:00 Africa/Cairo (UTC+2) = 18:00 UTC, every day.
    # Earlier than 22:00 to absorb GitHub Actions' typical 30-90min cron delay
    # so the report still lands the same evening, not after midnight.
    - cron: '0 18 * * *'
  workflow_dispatch: {}  # allow manual trigger from the Actions tab for testing

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install deps
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Send report
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          REPORT_TIMEZONE: Africa/Cairo
        run: node daily-report.js
